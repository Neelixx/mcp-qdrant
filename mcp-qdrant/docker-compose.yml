services:
  ################################################################
  # QDRANT (Vector DB)
  ################################################################
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "0.0.0.0:6333:6333"
      - "0.0.0.0:6334:6334"
    volumes:
      - /mnt/data/AI/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__ENABLE_CORS=true
      - QDRANT__LOG_LEVEL=INFO
    networks:
      ai-net:
        aliases:
          - qdrant

  ################################################################
  # OLLAMA (ROCm)
  ################################################################
  ollama:
    image: ollama/ollama:rocm
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    devices:
      - /dev/kfd
      - /dev/dri
    volumes:
      - /mnt/data/AI/ollama/docker:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_CONTEXT_LENGTH=65536
    networks:
      - ai-net

  
  ################################################################
  # QDRANT MCP Server
  ################################################################
  mcp-qdrant:
    build: .
    ports:
      - "0.0.0.0:8090:8080"
      - "0.0.0.0:9090:9091"
    environment:
      - MCP_QDRANT_HOST=qdrant
      - MCP_QDRANT_PORT=6334
      - MCP_QDRANT_COLLECTIONS=${MCP_QDRANT_COLLECTIONS:-all}
      - MCP_QDRANT_SUMMARYMAXRESULTS=${MCP_QDRANT_SUMMARYMAXRESULTS:-3}
      - MCP_QDRANT_SUMMARYMAXLENGTH=${MCP_QDRANT_SUMMARYMAXLENGTH:-500}
      - MCP_QDRANT_SUMMARIZEMODEL=${MCP_SUMMARIZE_MODEL:-gemma4}
      - MCP_EMBEDDING_SERVICE_URL=http://ollama:11434
      - MCP_EMBEDDING_MODEL=${MCP_EMBEDDING_MODEL:-nomic-embed-text-v2-moe}
      - MCP_EMBEDDING_DIMENSION=${MCP_EMBEDDING_DIMENSION:-768}
      - MCP_EMBEDDING_TIMEOUT_MS=${MCP_EMBEDDING_TIMEOUT_MS:-10000}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    networks:
      - ai-net
    depends_on:
      - qdrant
      - ollama
    restart: unless-stopped

networks:
  ai-net:
    driver: bridge

